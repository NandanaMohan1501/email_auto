<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Email API test page</title>
</head>
<body>
    <h1>Email API test page</h1>
    <p><a href="/docs">Open Swagger</a></p>

    <div id="dashboard">
    <h2>Email filters</h2>
    <form id="filters">
        <label>Mailbox
            <select id="mailbox" name="mailbox">
                <option value="">All</option>
            </select>
        </label>

        <label>Priority
            <select id="priority" name="priority">
                <option value="">All</option>
            </select>
        </label>

        <label>Status
            <select id="status" name="status">
                <option value="">All</option>
            </select>
        </label>

        <label>Category
            <select id="category" name="category">
                <option value="">All</option>
            </select>
        </label>

        <label>Sender
            <input id="sender" name="sender" type="text">
        </label>

        <label>Date
            <select id="datePreset">
                <option value="">All dates</option>
                <option value="today">Today</option>
                <option value="this_week">This week</option>
                <option value="last_week">Last week</option>
                <option value="this_month">This month</option>
                <option value="last_month">Last month</option>
                <option value="custom">Custom range</option>
            </select>
        </label>

        <label>From
            <input id="fromDate" name="from_date" type="date">
        </label>

        <label>To
            <input id="toDate" name="to_date" type="date">
        </label>

        <button type="submit">Apply filters</button>
        <button type="button" id="clearFilters">Clear</button>
    </form>

    <p id="emailStatus"></p>
    <table id="emailTable" border="1" cellpadding="5">
        <thead>
            <tr>
                <th>Mailbox</th>
                <th>Subject</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Category</th>
                <th>Received On</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    </div>

    <section id="conversationPanel" hidden>
        <button type="button" id="backToDashboard">Back to conversations</button>
        <h2 id="conversationTitle">Conversation</h2>
        <div id="conversation"></div>
    </section>

    <script>
        const filterNames = ["mailbox", "priority", "status", "category", "sender"];
        const optionEndpoints = {
            mailbox: "/emails/mailboxes",
            priority: "/emails/priorities",
            status: "/emails/statuses",
            category: "/emails/categories",
        };

        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, "0");
            const day = String(date.getDate()).padStart(2, "0");
            return `${year}-${month}-${day}`;
        }

        function startOfWeek(date) {
            const result = new Date(date);
            const day = result.getDay();
            const daysFromMonday = day === 0 ? 6 : day - 1;
            result.setDate(result.getDate() - daysFromMonday);
            return result;
        }

        function setDatePreset(preset) {
            const today = new Date();
            let from = null;
            let to = null;

            if (preset === "today") {
                from = today;
                to = today;
            } else if (preset === "this_week") {
                from = startOfWeek(today);
                to = new Date(from);
                to.setDate(to.getDate() + 6);
            } else if (preset === "last_week") {
                to = startOfWeek(today);
                to.setDate(to.getDate() - 1);
                from = new Date(to);
                from.setDate(from.getDate() - 6);
            } else if (preset === "this_month") {
                from = new Date(today.getFullYear(), today.getMonth(), 1);
                to = new Date(today.getFullYear(), today.getMonth() + 1, 0);
            } else if (preset === "last_month") {
                from = new Date(today.getFullYear(), today.getMonth() - 1, 1);
                to = new Date(today.getFullYear(), today.getMonth(), 0);
            }

            if (preset !== "custom") {
                document.querySelector("#fromDate").value = from ? formatDate(from) : "";
                document.querySelector("#toDate").value = to ? formatDate(to) : "";
            }
        }

        async function requestJson(url) {
            const response = await fetch(url);
            if (!response.ok) {
                const body = await response.text();
                throw new Error(`${response.status}: ${body}`);
            }
            return response.json();
        }

        function addCell(row, value) {
            const cell = document.createElement("td");
            cell.textContent = value ?? "";
            row.appendChild(cell);
            return cell;
        }

        async function loadOptions() {
            for (const [name, endpoint] of Object.entries(optionEndpoints)) {
                const select = document.querySelector(`#${name}`);
                try {
                    const values = await requestJson(endpoint);
                    for (const value of values) {
                        const option = document.createElement("option");
                        option.value = value;
                        option.textContent = value;
                        select.appendChild(option);
                    }
                } catch (error) {
                    document.querySelector("#emailStatus").textContent =
                        `Could not load ${name} options: ${error.message}`;
                }
            }
        }

        async function loadDashboard() {
            const params = new URLSearchParams();
            for (const name of filterNames) {
                const value = document.querySelector(`#${name}`).value.trim();
                if (value) params.set(name, value);
            }

            const fromDate = document.querySelector("#fromDate").value;
            const toDate = document.querySelector("#toDate").value;
            if (fromDate) params.set("from_date", fromDate);
            if (toDate) params.set("to_date", toDate);

            const status = document.querySelector("#emailStatus");
            const tbody = document.querySelector("#emailTable tbody");
            status.textContent = "Loading...";
            tbody.replaceChildren();

            try {
                const query = params.toString();
                const conversations = await requestJson(
                    `/threads/dashboard${query ? `?${query}` : ""}`
                );
                for (const conversation of conversations) {
                    const row = document.createElement("tr");
                    addCell(row, conversation.mailbox);
                    addCell(row, conversation.subject);
                    addCell(row, conversation.priority);
                    addCell(row, conversation.status);
                    addCell(row, conversation.category);
                    addCell(row, conversation.received_on);
                    const actionCell = addCell(row, "");
                    const viewButton = document.createElement("button");
                    viewButton.type = "button";
                    viewButton.textContent = "View";
                    viewButton.addEventListener(
                        "click",
                        () => loadConversation(conversation.thread_id)
                    );
                    actionCell.appendChild(viewButton);
                    tbody.appendChild(row);
                }
                status.textContent = `${conversations.length} conversation(s) returned.`;
            } catch (error) {
                status.textContent = `Error: ${error.message}`;
            }
        }

        async function loadConversation(threadId) {
            const container = document.querySelector("#conversation");
            document.querySelector("#dashboard").hidden = true;
            document.querySelector("#conversationPanel").hidden = false;
            document.querySelector("#conversationTitle").textContent =
                `Conversation for thread ${threadId}`;
            container.textContent = "Loading...";

            try {
                const emails = await requestJson(`/threads/${threadId}/emails`);
                container.replaceChildren();
                for (const email of emails) {
                    const article = document.createElement("article");
                    const heading = document.createElement("h3");
                    heading.textContent = email.subject;
                    const metadata = document.createElement("p");
                    metadata.textContent =
                        `From: ${email.sender} | Received: ${email.received_on}`;
                    const body = document.createElement("pre");
                    body.textContent = email.body;
                    article.append(heading, metadata, body, document.createElement("hr"));
                    container.appendChild(article);
                }
                if (!emails.length) container.textContent = "No emails in this thread.";
            } catch (error) {
                container.textContent = `Error: ${error.message}`;
            }
        }

        document.querySelector("#filters").addEventListener("submit", (event) => {
            event.preventDefault();
            loadDashboard();
        });
        document.querySelector("#datePreset").addEventListener("change", (event) => {
            setDatePreset(event.target.value);
        });
        document.querySelector("#clearFilters").addEventListener("click", () => {
            document.querySelector("#filters").reset();
            loadDashboard();
        });
        document.querySelector("#backToDashboard").addEventListener("click", () => {
            document.querySelector("#conversationPanel").hidden = true;
            document.querySelector("#dashboard").hidden = false;
        });

        loadOptions();
        loadDashboard();
    </script>
</body>
</html>
